<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#B3122B">
<title>Ficha médica de emergencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F5F7;
    --surface: #FFFFFF;
    --ink: #14202B;
    --muted: #556674;
    --line: #D3DBE1;
    --rojo: #B3122B;
    --rojo-suave: #FCECEF;
    --verde: #0B5D4B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--ink);
  }
  .banda {
    background: var(--rojo);
    color: #fff;
    padding: 10px 16px;
    font-weight: 700;
    font-size: 15px;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }

  .persona { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .foto {
    width: 104px; height: 104px; flex: none;
    border-radius: 14px; object-fit: cover; background: #DCE3E8;
  }
  .foto-vacia {
    display: grid; place-items: center;
    font-size: 40px; font-weight: 700; color: var(--muted);
  }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 4px; overflow-wrap: anywhere; }
  .actualizado { color: var(--muted); font-size: 14px; margin: 0; }

  .sangre {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    background: var(--rojo); color: #fff;
    border-radius: 16px; padding: 12px 20px 14px;
  }
  .sangre .etq { font-size: 18px; font-weight: 700; }
  .sangre .valor { font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .sangre .valor.largo { font-size: 36px; }

  .bloque {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px 14px;
    margin-top: 12px;
  }
  .bloque h2 { font-size: 16px; margin: 0 0 2px; color: var(--muted); }
  .bloque p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bloque.critico { border: 2px solid var(--rojo); background: var(--rojo-suave); }
  .bloque.critico h2 { color: var(--rojo); }

  .contactos h2 { font-size: 16px; color: var(--muted); margin: 20px 0 0; }
  .contacto {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 68px; margin-top: 8px; padding: 12px 16px;
    background: var(--verde); color: #fff; text-decoration: none;
    border-radius: 12px;
  }
  .contacto .quien { font-weight: 700; overflow-wrap: anywhere; }
  .contacto .rel { display: block; font-size: 14px; font-weight: 400; opacity: .9; }
  .contacto .num { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
  .contacto svg { width: 22px; height: 22px; fill: currentColor; flex: none; }

  .barra {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .barra .contacto { max-width: 528px; margin: 0 auto; min-height: 60px; }

  a:focus-visible, button:focus-visible { outline: 3px solid #000; outline-offset: 2px; }

  .estado { text-align: center; padding: 56px 8px; color: var(--muted); }
  .estado h2 { color: var(--ink); font-size: 22px; margin: 0 0 8px; }
  .estado button {
    margin-top: 16px; font: inherit; font-weight: 700; color: #fff; background: var(--ink);
    border: 0; border-radius: 10px; padding: 12px 20px; min-height: 48px;
  }
</style>
</head>
<body>
<header class="banda">Ficha médica de emergencia</header>
<main id="app" aria-live="polite">
  <p class="estado">Cargando ficha…</p>
</main>
<div class="barra" id="barra" hidden></div>

<script src="config.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const barra = document.getElementById('barra');
  const id = new URLSearchParams(location.search).get('id');

  const ICONO_TEL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>';

  function el(tag, cls, txt) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function telHref(t) { return 'tel:' + String(t).replace(/[^\d+]/g, ''); }

  function estado(titulo, detalle, reintentar) {
    barra.hidden = true;
    const box = el('div', 'estado');
    box.appendChild(el('h2', null, titulo));
    box.appendChild(el('p', null, detalle));
    if (reintentar) {
      const b = el('button', null, 'Reintentar');
      b.type = 'button';
      b.onclick = cargar;
      box.appendChild(b);
    }
    app.replaceChildren(box);
  }

  function bloque(titulo, texto, critico) {
    const b = el('section', 'bloque' + (critico ? ' critico' : ''));
    b.appendChild(el('h2', null, titulo));
    b.appendChild(el('p', null, texto || 'No especificado'));
    return b;
  }

  function botonLlamar(c, clase) {
    const a = el('a', clase || 'contacto');
    a.href = telHref(c.telefono);
    const quien = el('span', 'quien', c.nombre);
    if (c.parentesco) quien.appendChild(el('span', 'rel', c.parentesco));
    const num = el('span', 'num');
    num.appendChild(document.createTextNode(c.telefono));
    num.insertAdjacentHTML('beforeend', ICONO_TEL);
    a.append(quien, num);
    a.setAttribute('aria-label', 'Llamar a ' + c.nombre + (c.parentesco ? ', ' + c.parentesco : '') + ', ' + c.telefono);
    return a;
  }

  function render(f) {
    document.title = 'Ficha médica: ' + f.nombre;
    const frag = document.createDocumentFragment();

    // Identidad
    const persona = el('div', 'persona');
    if (f.foto) {
      const img = el('img', 'foto');
      img.src = f.foto;
      img.alt = 'Foto de ' + f.nombre;
      persona.appendChild(img);
    } else {
      persona.appendChild(el('div', 'foto foto-vacia', (f.nombre || '?').trim().charAt(0).toUpperCase()));
    }
    const datos = el('div');
    datos.appendChild(el('h1', null, f.nombre));
    if (f.actualizado) {
      const fecha = new Date(f.actualizado).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
      datos.appendChild(el('p', 'actualizado', 'Actualizada el ' + fecha));
    }
    persona.appendChild(datos);
    frag.appendChild(persona);

    // Tipo de sangre
    const sangre = el('div', 'sangre');
    sangre.appendChild(el('span', 'etq', 'Tipo de sangre'));
    sangre.appendChild(el('span', 'valor' + (f.tipoSangre.length > 3 ? ' largo' : ''), f.tipoSangre));
    frag.appendChild(sangre);

    // Datos médicos
    frag.appendChild(bloque('Alergias a medicamentos', f.alergiasMedicamentos, true));
    frag.appendChild(bloque('Otras alergias', f.alergias, true));
    frag.appendChild(bloque('Tratamientos en curso', f.tratamientos, false));

    // Contactos
    const contactos = el('section', 'contactos');
    contactos.appendChild(el('h2', null, 'Contactos de emergencia'));
    (f.contactos || []).forEach(function (c) { contactos.appendChild(botonLlamar(c)); });
    frag.appendChild(contactos);

    app.replaceChildren(frag);

    // Barra fija con el contacto principal
    if (f.contactos && f.contactos.length) {
      barra.replaceChildren(botonLlamar(f.contactos[0]));
      barra.hidden = false;
    }
  }

  async function cargar() {
    if (!id) {
      estado('Esta etiqueta no tiene ficha', 'El enlace no incluye el identificador de una ficha médica.');
      return;
    }
    app.replaceChildren(el('p', 'estado', 'Cargando ficha…'));
    barra.hidden = true;

    let datos;
    try {
      const r = await fetch(API_URL + '?action=get&id=' + encodeURIComponent(id));
      datos = await r.json();
    } catch (e) {
      estado('No se pudo cargar la ficha', 'Revisa la conexión a internet e inténtalo de nuevo.', true);
      return;
    }
    if (!datos.ok) {
      estado('No se encontró la ficha', datos.error || 'La ficha ya no existe.');
      return;
    }
    render(datos.ficha);
  }

  cargar();
})();
</script>
</body>
</html>
